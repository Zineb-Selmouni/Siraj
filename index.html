<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <title>Siraj 360 — Plateforme marocaine de veille médiatique</title>
    <meta
      name="description"
      content="Presse, TV, radios et réseaux sociaux marocains analysés en continu par une IA qui comprend l'arabe, la darija, le français et l'anglais. Données hébergées au Maroc, conformité loi 09-08."
    />
    <meta name="theme-color" content="#0A1425" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Harmony Technology" />
    <meta property="og:title" content="Siraj 360 — Plateforme marocaine de veille médiatique" />
    <meta
      property="og:description"
      content="Éclairer aujourd'hui, anticiper demain. Veille médiatique et intelligence stratégique souveraines, en arabe, darija, français et anglais."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <!--
      Formulaire détecté par Netlify au moment du build.

      Netlify analyse le HTML STATIQUE pour recenser les formulaires ; celui
      que React rend à l'exécution lui est invisible. Ce double caché existe
      uniquement pour la détection : les champs doivent rester alignés sur
      ceux envoyés par src/lib/pilotRequest.ts.

      `netlify-honeypot` nomme le champ piège : rempli, la soumission est
      écartée sans jamais atteindre le tableau de bord.
    -->
    <form name="pilote" data-netlify="true" netlify-honeypot="site-web" hidden>
      <input type="text" name="organisation" />
      <input type="text" name="profile" />
      <input type="text" name="fullName" />
      <input type="text" name="role" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="topics"></textarea>
      <input type="text" name="lang" />
      <input type="text" name="consentAt" />
      <input type="text" name="site-web" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
